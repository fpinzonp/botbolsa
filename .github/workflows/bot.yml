name: Trading bot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # cada 15 min, fuera del minuto 0 (hora pico de GitHub)
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
  push:                       # al subir cambios de código solo se corren las pruebas
    paths: ["bot/**", "tests/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write             # para guardar data/ y docs/data.json en el repo
  issues: write               # para el aviso de vencimiento del token de cron-job.org

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar bot
        run: python -m bot.main
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Opcionales: se configuran en Settings > Secrets and variables > Actions > Variables
          ANALYZER: ${{ vars.ANALYZER }}
          MODEL: ${{ vars.MODEL }}
          MIN_CONFIDENCE: ${{ vars.MIN_CONFIDENCE }}
          POSITION_PCT: ${{ vars.POSITION_PCT }}
          MAX_POSITIONS: ${{ vars.MAX_POSITIONS }}
          STOP_LOSS_PCT: ${{ vars.STOP_LOSS_PCT }}
          TAKE_PROFIT_PCT: ${{ vars.TAKE_PROFIT_PCT }}
          MAX_HOLD_DAYS: ${{ vars.MAX_HOLD_DAYS }}
          PENDING_MAX_HOURS: ${{ vars.PENDING_MAX_HOURS }}
          MAX_CHASE_PCT: ${{ vars.MAX_CHASE_PCT }}
          TRADE_STOCKS: ${{ vars.TRADE_STOCKS }}
          TRADE_CRYPTO: ${{ vars.TRADE_CRYPTO }}
          DRY_RUN: ${{ vars.DRY_RUN }}

      - name: Guardar estado y datos del dashboard
        run: |
          git config user.name "trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "bot: ejecución $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      # cron-job.org lanza el bot con un token de GitHub que vence. Una semana antes se abre
      # un issue (GitHub avisa por correo). Al renovarlo, cambiar la variable TOKEN_REMINDER_DATE.
      - name: Aviso de vencimiento del token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REMINDER_DATE: ${{ vars.TOKEN_REMINDER_DATE || '2027-02-15' }}
        run: |
          if [ "$(date -u +%F)" \< "$REMINDER_DATE" ]; then exit 0; fi
          title="Renovar el token de cron-job.org"
          if [ -n "$(gh issue list --state open --search "$title in:title" --json number --jq '.[].number')" ]; then exit 0; fi
          gh issue create --title "$title" --body "@fpinzonp el token que usa cron-job.org para lanzar el bot vence pronto (creado el 2026-11-24 con 90 días). Si vence, el bot deja de correr y cron-job.org muestra error 401.

          1. Crea uno nuevo en https://github.com/settings/personal-access-tokens/new (solo el repo botbolsa, permiso Actions: Read and write).
          2. En cron-job.org reemplaza el header Authorization por: Bearer <token nuevo>.
          3. En Settings > Secrets and variables > Actions > Variables pon TOKEN_REMINDER_DATE una semana antes del nuevo vencimiento (AAAA-MM-DD).
          4. Cierra este issue."

  tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest && python -m pytest -q
